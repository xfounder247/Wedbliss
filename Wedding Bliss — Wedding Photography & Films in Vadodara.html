<style>

*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.7;font-weight:300}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2;font-weight:700}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--maroon);font-weight:700}.logo b{color:var(--gold)}
nav a{margin-left:22px;font-size:.92rem;font-weight:500;color:var(--mute);padding:4px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{color:var(--maroon);border-color:var(--gold)}
#burger{display:none;background:none;border:0;font-size:1.7rem;color:var(--maroon)}
.btn{display:inline-block;background:linear-gradient(135deg,var(--maroon),var(--rose));color:#fff;border:0;border-radius:40px;padding:12px 28px;font:500 .95rem Poppins;cursor:pointer;box-shadow:0 8px 20px rgba(122,31,61,.25);transition:.25s}
.btn:hover{transform:translateY(-2px)}.btn.alt{background:transparent;color:var(--maroon);border:1.5px solid var(--gold);box-shadow:none}
.btn.sm{padding:8px 20px;font-size:.85rem}
.wrap{max-width:1150px;margin:auto;padding:70px 20px}
.hero{padding:50px 20px 20px;background:#fff}.hs{max-width:1150px;margin:auto;display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);color:var(--maroon)}.hero p{color:var(--mute);margin:18px 0 28px;font-size:1.08rem;max-width:520px}.cta{text-align:center;color:#fff;padding:70px 20px;background:linear-gradient(135deg,var(--maroon),var(--rose))}.cta p{margin:12px 0 22px}.cta h2{font-size:2.3rem}
.tag{letter-spacing:.3em;text-transform:uppercase;font-size:.78rem;color:var(--gold);font-weight:500}
.pic{border-radius:16px;overflow:hidden;aspect-ratio:400/260;margin-bottom:16px;background:var(--blush)}.pic svg,.art svg{width:100%;height:100%;display:block}.diff{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.diff .card{padding:22px}.diff s{color:#a08c93;display:block;font-size:.9rem}.diff b{color:var(--maroon);font-weight:500}.stars{color:var(--gold);letter-spacing:3px}.who{margin-top:14px;font-weight:500;color:var(--maroon);font-size:.9rem}.cap{padding:12px 4px 0;font-weight:500;color:var(--maroon)}
.sec-h{text-align:center;margin-bottom:44px}.sec-h h2{font-size:clamp(1.8rem,4vw,2.6rem);color:var(--maroon);margin-top:6px}.sec-h p{color:var(--mute);max-width:620px;margin:10px auto 0}
.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;transition:.3s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(122,31,61,.12)}
.ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:var(--blush);margin-bottom:16px}
.card h3{font-size:1.25rem;margin-bottom:8px;color:var(--maroon)}.card p{color:var(--mute);font-size:.93rem}
.band{background:var(--blush)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;text-align:center}
.stats b{font-family:'Playfair Display',serif;font-size:2.6rem;color:var(--maroon);display:block}
.split{display:grid;gap:44px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.art{aspect-ratio:4/5;border-radius:200px 200px 24px 24px;overflow:hidden;box-shadow:0 20px 50px rgba(122,31,61,.18)}
.page{display:none;animation:f .5s}.page.on{display:block}@keyframes f{from{opacity:0;transform:translateY(12px)}}
.pagehead{text-align:center;color:var(--maroon);padding:70px 20px;background:var(--blush);border-bottom:1px solid var(--line)}.pagehead h1{font-size:clamp(2rem,5vw,3.2rem)}
/* accordion */
.acc{max-width:900px;margin:auto;display:grid;gap:16px}
.acc details{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:20px 24px;font:700 1.15rem 'Playfair Display',serif;color:var(--maroon)}
.acc summary::-webkit-details-marker{display:none}.acc summary::after{content:'+';margin-left:auto;font-size:1.6rem;color:var(--gold);transition:.3s}
.acc details[open] summary::after{transform:rotate(45deg)}.acc details[open]{box-shadow:0 14px 36px rgba(122,31,61,.12)}
.acc .ico{margin:0;width:46px;height:46px;font-size:1.3rem;flex:none}
.body{padding:0 24px 26px}.body p{color:var(--mute);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.chips span{background:var(--blush);padding:5px 14px;border-radius:30px;font-size:.84rem;font-weight:400}
/* form */
.form{display:grid;gap:14px}
input,select,textarea{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 .95rem Poppins}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.contact-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px}
.soc a{display:inline-block;margin:6px 8px 0 0;padding:8px 18px;border:1px solid var(--gold);border-radius:30px;font-size:.88rem;color:var(--maroon)}
.faq{max-width:800px;margin:auto}.faq details{border-bottom:1px solid var(--line);padding:14px 4px}.faq summary{cursor:pointer;font-weight:500}.faq p{color:var(--mute);padding-top:8px}
footer{background:#3a0f20;color:#e9d6d0;padding:50px 20px 90px;text-align:center;font-size:.9rem}footer a{color:var(--gold);margin:0 8px}
/* widget + modal */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:10px}
.fab a,.fab button{width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;font-size:1.5rem;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.f-call{background:#2f7ed8}.f-wa{background:#25a244}.f-bk{background:var(--maroon)}
#modal{position:fixed;inset:0;background:rgba(30,8,18,.65);z-index:80;display:none;place-items:center;padding:16px}
#modal.on{display:grid}.mbox{background:var(--card);border-radius:22px;padding:28px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.mbox h3{color:var(--maroon);font-size:1.5rem;margin-bottom:4px}.x{float:right;background:none;border:0;font-size:1.6rem;color:var(--mute);cursor:pointer}
@media(max-width:820px){#burger{display:block}nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);display:none;flex-direction:column;padding:10px 20px 20px;border-bottom:1px solid var(--line)}nav.open{display:flex}nav a{margin:0;padding:12px 0}.wrap{padding:50px 18px}}
</style>
</head>

services:`<div class="pagehead"><div class="tag">Our Services</div><h1>Crafted for Every Celebration</h1><p style="max-width:600px;margin:10px auto 0">Tap a service to explore what is included, then book it directly.</p></div>
<section class="wrap"><div class="acc">${S.map((s,i)=>`<details ${i==0?'open':''}><summary><span class="ico">${s[0]}</span>${i+1}. ${s[1]}</summary><div class="body"><div class="pic">${sc(i)}</div><p>${s[2]}</p><div class="chips">${s[3].map(c=>`<span>${c}</span>`).join('')}</div><button class="btn sm" onclick="openBook('${s[1].replace(/'/g,"\\'")}')">Book ${s[1]}</button></div></details>`).join('')}</div></section>
<section class="band"><div class="wrap">${E('Bundle & save',['Not Sure Where to Start?','Mix and match any services — we will build a package around your functions and budget.'])}<p style="text-align:center"><button class="btn" onclick="openBook()">Get a Custom Package</button> <a class="btn alt" href="#contact">Talk to Us</a></p></div></section>`,
about:`<div class="pagehead"><div class="tag">About Us</div><h1>The Team Behind Your Memories</h1></div>
<section class="wrap split"><div class="art">${sc(0)}</div><div><div class="tag">Our story</div><h2 style="color:var(--maroon);font-size:2.2rem;margin:8px 0 16px">Born in Vadodara, Made for Love Stories</h2><p style="color:var(--mute)">Wedding Bliss began with a simple belief: a wedding is not one event but a hundred tiny feelings — and they deserve to be remembered exactly as they were. Based in Vadodara, we have grown into a full-service wedding studio covering photography, cinematography, pre-wedding shoots, albums and digital invitations.</p><p style="color:var(--mute);margin-top:14px">From intimate roka ceremonies to multi-day celebrations with sangeet, haldi, mehndi and reception, we bring the same calm, creative energy to every family we work with.</p></div></section>
<section class="band"><div class="wrap">${E('What guides us',['Our Values']) }${cards([["❤️","Emotion First","We chase real feelings over perfect poses."],["🕊️","Respect for Tradition","We understand rituals and families, and cover them with care."],["🔍","Detail Obsessed","From jewellery close-ups to wide mandap frames."],["🌱","Always Learning","New techniques, new gear, new storytelling ideas every season."]])}</div></section>
<section class="wrap">${E('Our process',['How We Work'])}${cards([["🗓️","Pre-Wedding Consultation","We understand your families, functions and favourite moments."],["🎯","Shot Planning","A tailored shot list and schedule so nothing is missed."],["🎥","Coverage","Photographers, cinematographers and drone pilots work together."],["🎨","Post-Production","Colour grading, retouching and storytelling edits."],["📦","Delivery","Online galleries, films, albums and prints, beautifully packaged."],["🤍","After-Care","We stay in touch for reprints, extra edits and anniversaries."]])}</section>
<section class="band"><div class="wrap"><p style="text-align:center"><a class="btn" href="#contact">Say Hello</a></p></div></section>`,
vision:`<div class="pagehead"><div class="tag">Mission &amp; Vision</div><h1>Why We Do What We Do</h1></div>
<section class="wrap"><div class="grid"><div class="card"><div class="ico">🎯</div><h3>Our Mission</h3><p>To document every wedding with honesty, artistry and warmth — delivering photographs and films that carry the true emotion of the day, backed by dependable service from first call to final delivery.</p></div><div class="card"><div class="ico">🔭</div><h3>Our Vision</h3><p>To become Vadodara's most trusted wedding storytelling studio, known for creative excellence, genuine relationships and memories that stay vivid for generations.</p></div></div></section>
<section class="band"><div class="wrap">${E('Our promise',['What You Can Count On'])}${cards([["✅","Honest Planning","Clear scope, fair packages and no last-minute surprises."],["⏱️","Respect for Time","Punctual teams and timely delivery."],["🎞️","Quality Craft","Careful editing and consistent colour across your story."],["🤲","Personal Care","A real team that treats your wedding like its own."],["🔒","Safe Memories","Secure backups of every file until delivery."],["🌟","Delight","Our goal is for you to smile every time you revisit your story."]])}</div></section>
<section class="wrap" style="text-align:center"><h2 style="color:var(--maroon);margin-bottom:12px">Let's tell your story together</h2><button class="btn" onclick="openBook()">Book a Date</button></section>`,
contact:`<div class="pagehead"><div class="tag">Contact Us</div><h1>Let's Plan Your Big Day</h1></div>
<section class="wrap"><div class="split" style="align-items:start"><div class="contact-box"><h3 style="color:var(--maroon);font-size:1.6rem;margin-bottom:16px">Get in touch</h3><p>📍 ${ADDRESS}</p><p>📞 <a href="tel:+${PHONE}">${PHONE_SHOW}</a></p><p>✉️ <a href="mailto:${EMAIL}">${EMAIL}</a></p><p>🕙 Open daily · by appointment</p><div class="soc" style="margin-top:14px"><a href="https://www.instagram.com/wed_bliss" target="_blank" rel="noopener">Instagram</a><a href="https://www.youtube.com/weddingbliss" target="_blank" rel="noopener">YouTube</a><a href="https://www.facebook.com/weareweddingbliss" target="_blank" rel="noopener">Facebook</a></div><p style="margin-top:18px"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${PHONE}">Chat on WhatsApp</a></p></div>
<div class="contact-box"><h3 style="color:var(--maroon);font-size:1.6rem;margin-bottom:16px">Quick enquiry</h3><div class="form"><input id="cn" placeholder="Your name"><input id="cp" placeholder="Phone"><input id="cd" type="date"><textarea id="cm" rows="4" placeholder="Tell us about your wedding"></textarea><button class="btn" onclick="sendC()">Send via WhatsApp</button></div></div></div></section>
<section class="band"><div class="wrap">${E('Before you ask',['Quick Answers'])}${faq}</div></section>`};
const $=id=>document.getElementById(id);
function route(){let h=(location.hash||'#home').slice(1);if(!P[h])h='home';$('app').innerHTML=`<div class="page on">${P[h]}</div>`;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+h));$('nav').classList.remove('open');scrollTo(0,0);setMin()}
function setMin(){const t=new Date().toISOString().split('T')[0];document.querySelectorAll('input[type=date]').forEach(d=>d.min=t)}
function openBook(s){$('bs').innerHTML='<option value="">Select a service</option>'+S.map(x=>`<option${x[1]===s?' selected':''}>${x[1]}</option>`).join('');$('modal').classList.add('on');setMin()}
function closeBook(){$('modal').classList.remove('on')}
function wa(t){window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(t)}`,'_blank')}
function submitBook(){const n=$('bn').value.trim(),d=$('bd').value;if(!n||!d||!$('bs').value){alert('Please add your name, a service and a date.');return}
wa(`Hello Wedding Bliss! I'd like to book.\nName: ${n}\nPhone: ${$('bp').value}\nService: ${$('bs').value}\nDate: ${d}\nVenue: ${$('bl').value}\nNotes: ${$('bm').value}`);closeBook()}
function sendC(){wa(`Hello Wedding Bliss!\nName: ${$('cn').value}\nPhone: ${$('cp').value}\nWedding date: ${$('cd').value}\n${$('cm').value}`)}
$('fcall').href='tel:+'+PHONE;$('fwa').href='https://wa.me/'+PHONE+'?text='+encodeURIComponent('Hello Wedding Bliss!');$('yr').textContent=new Date().getFullYear();
$('burger').onclick=()=>$('nav').classList.toggle('open');$('modal').onclick=e=>{if(e.target.id=='modal')closeBook()};
addEventListener('hashchange',route);route();
</script>
</body>
</html>
